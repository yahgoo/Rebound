<!doctype html>
<html lang="{{ 'zh-CN' if language.lower().startswith('zh') else 'en' }}" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ traveller_name }} · Rebound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.3/sse.js"></script>
  </head>
  <body
    class="traveller min-h-full bg-slate-950 text-slate-100 antialiased"
    {% if stream_url %}
      hx-ext="sse"
      sse-connect="{{ stream_url }}"
    {% endif %}
  >
    <main class="flex min-h-screen items-center justify-center p-4">
      {% include "_pane_traveller.html" %}
    </main>
  </body>
</html>
