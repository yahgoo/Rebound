<section
  id="trace-pane-root"
  aria-labelledby="trace-pane-title"
  class="flex h-full min-h-0 flex-col overflow-hidden"
>
  <header class="flex items-center justify-between gap-4 border-b border-slate-700 px-5 py-4">
    <div>
      <p class="text-sm font-bold uppercase tracking-[0.18em] text-cyan-300">
        Recovery engine
      </p>
      <h2 id="trace-pane-title" class="mt-1 text-2xl font-black text-white">
        Live agent trace
      </h2>
    </div>
    <span
      id="trace-connection-status"
      role="status"
      aria-live="polite"
      class="rounded-full border border-amber-300/50 bg-amber-300/10 px-3 py-1.5 text-sm font-extrabold uppercase tracking-wide text-amber-200"
    >
      Connecting
    </span>
  </header>

  <div class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-5">
    <section
      id="guardian-policy"
      aria-labelledby="guardian-policy-title"
      class="rounded-xl border border-cyan-300/25 bg-cyan-300/5 p-4"
    >
      <div class="flex items-center justify-between gap-3">
        <h3 id="guardian-policy-title" class="text-lg font-black text-cyan-100">
          Guardian policy
        </h3>
        <span class="rounded-md bg-cyan-300/10 px-2.5 py-1 text-xs font-black uppercase tracking-wide text-cyan-200">
          Deterministic
        </span>
      </div>
      <dl class="mt-3 grid grid-cols-2 gap-3 text-base">
        <div class="rounded-lg bg-slate-950/60 p-3">
          <dt class="text-sm font-bold uppercase tracking-wide text-slate-400">Effective cap</dt>
          <dd id="guardian-effective-cap" class="mt-1 font-mono text-xl font-black text-white">Pending</dd>
        </div>
        <div class="rounded-lg bg-slate-950/60 p-3">
          <dt class="text-sm font-bold uppercase tracking-wide text-slate-400">Confirmation</dt>
          <dd id="guardian-confirmation-state" class="mt-1 text-lg font-black text-amber-200">Not requested</dd>
        </div>
      </dl>
      <div class="mt-3 rounded-lg bg-slate-950/60 p-3">
        <p class="text-sm font-bold uppercase tracking-wide text-slate-400">Redactions performed</p>
        <ul id="guardian-redactions" class="mt-2 flex flex-wrap gap-2" aria-live="polite">
          <li class="text-sm font-semibold text-slate-400">No redactions reported</li>
        </ul>
      </div>
    </section>

    <section aria-labelledby="sandbox-grid-title">
      <div class="flex items-baseline justify-between gap-3">
        <h3 id="sandbox-grid-title" class="text-lg font-black text-white">Sandbox fan-out</h3>
        <p id="sandbox-grid-summary" class="font-mono text-sm font-bold text-slate-400">Waiting</p>
      </div>
      <div
        id="sandbox-grid"
        class="mt-3 grid grid-cols-4 gap-2"
        role="list"
        aria-live="polite"
        aria-label="Sandbox states"
      ></div>
    </section>

    <section aria-labelledby="candidate-list-title">
      <div class="flex items-baseline justify-between gap-3">
        <h3 id="candidate-list-title" class="text-lg font-black text-white">Recovery options</h3>
        <p id="candidate-list-summary" class="font-mono text-sm font-bold text-slate-400">Waiting</p>
      </div>
      <div id="candidate-list" class="mt-3 space-y-3" aria-live="polite"></div>
    </section>

    <section aria-labelledby="trace-list-title">
      <div class="flex items-baseline justify-between gap-3">
        <h3 id="trace-list-title" class="text-lg font-black text-white">Agent steps</h3>
        <p id="trace-step-count" class="font-mono text-sm font-bold text-slate-400">0 steps</p>
      </div>
      <ol
        id="trace-list"
        class="mt-3 divide-y divide-slate-800 overflow-hidden rounded-xl border border-slate-800 bg-slate-950/60"
        aria-live="polite"
        aria-label="Complete agent step events"
      ></ol>
    </section>
  </div>
</section>
